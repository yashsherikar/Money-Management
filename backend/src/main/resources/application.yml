spring:
  application:
    name: moneymanager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moneymanager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

wishroom:
  api:
    base-url: ${WISHROOM_API_URL:https://bucketlist-4nwg.onrender.com}
