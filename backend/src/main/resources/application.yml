spring:
  application:
    name: moneymanager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moneymanager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Free Postgres / Neon / Supabase session poolers often allow only ~15 clients.
      # Default Hikari (10) + a previous instance still draining = EMAXCONNSESSION on deploy.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 300000
      # Drop idle connections quickly so a redeploy can connect while the old one is shutting down
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

wishroom:
  api:
    base-url: ${WISHROOM_API_URL:https://bucketlist-4nwg.onrender.com}

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}

firebase:
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

internal:
  cron-secret: ${INTERNAL_CRON_SECRET:}
